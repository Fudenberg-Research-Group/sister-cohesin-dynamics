#
#   conda env create -f env/environment.yml
#   conda activate sister-cohesin
#
# HOOMD-blue must be 3.x: the polymer scripts use hoomd.md.methods.NVE,
# which was removed in 4.0. Drop the [build=*gpu*] selector and cupy to
# install on a machine without a GPU.

name: sister-cohesin

channels:
  - conda-forge

dependencies:
  - python=3.10
  - pip
  - hoomd==3.11[build=*gpu*]
  - gsd==2.9
  - cupy
  - numpy<1.24
  - scipy
  - numba
  - pandas
  - matplotlib
  - joblib
  - ipython
  - notebook

  - pip:
    # Pinned to the commits used for the manuscript. Note that cooltools is
    # installed from git, not PyPI.
    - git+https://github.com/open2c/polychrom-hoomd.git@aad7ec01e632a0f4b45526a825ecb8530ba75a20
    - git+https://github.com/open2c/polykit.git@4bf364663ae4336384995ca21ca3bc29d689af25
    - git+https://github.com/open2c/cooltools.git@aedd531e80e7940311f941918c6551d3229eaf21
